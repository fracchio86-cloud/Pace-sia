name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara il progetto
        run: |
          rm -rf build_project
          mkdir -p build_project
          unzip -q Sacred_Reflection_Android_0.2_GitHubAPK.zip -d build_project

          echo "Contenuto estratto:"
          find build_project -maxdepth 4 -type f | head -100

            - name: Trova il progetto Android
        run: |
          PROJECT_DIR=$(find build_project -name build.gradle.kts -o -name build.gradle | head -1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRORE: progetto Android non trovato"
            find build_project -maxdepth 5 -type f
            exit 1
          fi

          echo "Progetto trovato in: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Compila APK
        run: |
          cd "$PROJECT_DIR"

          echo "Installo Gradle..."
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME"
          export PATH="$HOME/gradle-8.9/bin:$PATH"

          gradle assembleDebug --stacktrace

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: Sacred-Reflection-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
