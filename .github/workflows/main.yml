name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara il progetto
        run: |
          rm -rf build_project
          mkdir -p build_project

          unzip -q Sacred_Reflection_Android_0.2_GitHubAPK.zip -d build_project

          echo "=== FILE DEL PROGETTO ==="
          find build_project -maxdepth 5 -type f | head -200

      - name: Trova il progetto Android
        run: |
          PROJECT_DIR=""

          if [ -f "build_project/build.gradle.kts" ]; then
            PROJECT_DIR="build_project"
          else
            PROJECT_DIR=$(find build_project -maxdepth 3 -type f \
              \( -name "build.gradle.kts" -o -name "build.gradle" \) \
              ! -path "*/app/*" \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRORE: progetto Android non trovato"
            find build_project -maxdepth 6 -type f
            exit 1
          fi

          echo "Progetto Android trovato in: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Compila APK
        run: |
          cd "$PROJECT_DIR"

          echo "=== PROGETTO ==="
          pwd

          echo "=== FILE GRADLE ==="
          find . -maxdepth 3 -type f \
            \( -name "build.gradle.kts" -o -name "settings.gradle.kts" \) \
            -print

          echo "=== COMPILAZIONE ==="
          gradle assembleDebug --stacktrace

      - name: Trova APK generato
        run: |
          echo "=== CERCO GLI APK ==="

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          echo "=== OUTPUT BUILD ==="

          find "$PROJECT_DIR/app/build" -type f 2>/dev/null || true

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: Sacred-Reflection-APK
          path: |
            build_project/**/*.apk
          if-no-files-found: error
