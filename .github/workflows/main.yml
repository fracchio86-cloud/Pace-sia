name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara il progetto
        run: |
          mkdir -p build_project
          unzip -q Sacred_Reflection_Android_0.2_GitHubAPK.zip -d build_project
          echo "Contenuto:"
          find build_project -maxdepth 3 -type f | head -100

      - name: Trova il progetto Android
        run: |
          GRADLEW=$(find build_project -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERRORE: gradlew non trovato"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compila APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: Sacred-Reflection-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
