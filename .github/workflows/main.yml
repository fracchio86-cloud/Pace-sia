name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara il progetto
        run: |
          rm -rf build_project
          mkdir -p build_project
          unzip -q Sacred_Reflection_Android_0.2_GitHubAPK.zip -d build_project

          echo "=== CONTENUTO DEL PROGETTO ==="
          find build_project -maxdepth 5 -type f | head -200

      - name: Trova il progetto Android
        run: |
          GRADLEW=$(find build_project -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERRORE: gradlew non trovato"
            find build_project -maxdepth 8 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle trovato in: $GRADLEW"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aggiorna Gradle
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E 's/gradle-[0-9.]+-(bin|all)\.zip/gradle-8.11.1-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          fi

          chmod +x gradlew

          echo "=== VERSIONE GRADLE ==="
          ./gradlew --version

      - name: Compila APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Trova APK generato
        run: |
          echo "=== CER
